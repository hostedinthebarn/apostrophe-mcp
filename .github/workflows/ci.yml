name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      APOS_MONGODB_URI: mongodb://localhost:27017/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # No dependencies yet; npm ci starts once the build adds a lockfile.
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund; fi
      - name: Test, and check what would be published
        run: npm test
